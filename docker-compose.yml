version: "3.9"

services:
  downloader-service:
    build: ./downloader-service
    image: ghcr.io/gabspecter/downscribe-stack/downscribe-downloader:latest
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      WHISPER_API_URL: "http://whisper-service:8000/transcribe"
      OUTPUT_DIR: "/data/jobs"
      VISOLIX_DEBUG: "true"
      VISOLIX_LICENSE_CODE: "${VISOLIX_LICENSE_CODE}"
      VISOLIX_CLIENT_NAME: "${VISOLIX_CLIENT_NAME}"
      VISOLIX_SITE_URL: "${VISOLIX_SITE_URL}"
      VISOLIX_IP: "${VISOLIX_IP}"
      PROXY_URL: "${PROXY_URL}"
      PROXY_LOGIN: "${PROXY_LOGIN}"
      PROXY_PASSWORD: "${PROXY_PASSWORD}"
      PROXY_HOST: "${PROXY_HOST}"
      PROXY_LIST_URL: "${PROXY_LIST_URL}"
      PROXY_CACHE_TTL: "${PROXY_CACHE_TTL}"
      INSTAGRAM_COOKIE_FILE: "${INSTAGRAM_COOKIE_FILE}"
      INSTAGRAM_COOKIES_FROM_BROWSER: "${INSTAGRAM_COOKIES_FROM_BROWSER}"
      INSTAGRAM_COOKIE_HEADER: "${INSTAGRAM_COOKIE_HEADER}"
      VISOLIX_API_KEY: "${VISOLIX_API_KEY}"
      VISOLIX_BASE_URL: "${VISOLIX_BASE_URL}"
      VISOLIX_REST_API_URL: "${VISOLIX_REST_API_URL}"
      VISOLIX_REST_API_KEY: "${VISOLIX_REST_API_KEY}"
      VISOLIX_REST_YOUTUBE_FORMAT: "${VISOLIX_REST_YOUTUBE_FORMAT}"
      VISOLIX_PROGRESS_TIMEOUT: "${VISOLIX_PROGRESS_TIMEOUT}"
      VISOLIX_PROGRESS_INTERVAL: "${VISOLIX_PROGRESS_INTERVAL}"
      REDIS_URL: "${REDIS_URL:-redis://redis_redis:6379/0}"
      REDIS_PREFIX: "downscribe"
      DOWNLOAD_TTL_SECONDS: "3600"
      CLEANUP_INTERVAL_SECONDS: "300"
    ports:
      - "8001:8000"
    volumes:
      - downscribe_data:/data
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_public"
        - "traefik.http.routers.downscribe.rule=Host(`api.downscribe.com`)"
        - "traefik.http.routers.downscribe.entrypoints=websecure"
        - "traefik.http.routers.downscribe.tls=true"
        - "traefik.http.routers.downscribe.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.downscribe.service=downscribe"
        - "traefik.http.services.downscribe.loadbalancer.server.port=8000"
        - "traefik.http.middlewares.downscribe-https.redirectscheme.scheme=https"
        - "traefik.http.routers.downscribe-http.rule=Host(`api.downscribe.com`)"
        - "traefik.http.routers.downscribe-http.entrypoints=web"
        - "traefik.http.routers.downscribe-http.middlewares=downscribe-https"
        - "traefik.http.routers.downscribe-http.service=downscribe"
    networks:
      - network_public

  whisper-service:
    build: ./whisper-service
    image: ghcr.io/gabspecter/downscribe-stack/downscribe-whisper:latest
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      WHISPER_DEFAULT_MODEL: "small"
    ports:
      - "8002:8000"
    volumes:
      - downscribe_data:/data
    networks:
      - network_public

networks:
  network_public:
    external: true

volumes:
  downscribe_data:

